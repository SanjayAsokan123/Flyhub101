plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "com.google.gms.google-services"
    id "com.google.firebase.crashlytics"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "flyhub.com"
    compileSdk 36

    defaultConfig {
        applicationId "flyhub.com"
        minSdkVersion flutter.minSdkVersion          // 🔥 REQUIRED for Firebase OTP
        targetSdkVersion 36

        versionCode 1
        versionName "1.0"

        multiDexEnabled true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = "11"
    }

    signingConfigs {
        debug {
            storeFile file(System.properties['user.home'] + "/.android/debug.keystore")
            storePassword "android"
            keyAlias "AndroidDebugKey"
            keyPassword "android"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
            debuggable false
        }
        debug {
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }

    packagingOptions {
        resources {
            excludes += [
                    "META-INF/DEPENDENCIES",
                    "META-INF/LICENSE",
                    "META-INF/LICENSE.txt",
                    "META-INF/NOTICE",
                    "META-INF/NOTICE.txt",
                    "META-INF/AL2.0",
                    "META-INF/LGPL2.1"
            ]
        }
    }

    buildFeatures {
        buildConfig = true
    }
}

flutter {
    source "../.."
}

dependencies {
    // Firebase BOM
    implementation platform("com.google.firebase:firebase-bom:33.6.0")

    // Firebase Auth (Phone OTP needs this)
    implementation "com.google.firebase:firebase-auth-ktx"
    implementation "com.google.firebase:firebase-firestore"
    implementation "com.google.firebase:firebase-messaging"
    implementation "com.google.firebase:firebase-crashlytics"
    implementation "com.google.firebase:firebase-analytics"

    // SafetyNet + reCAPTCHA (🔥 REQUIRED for OTP)
    implementation "com.google.android.gms:play-services-auth:21.2.0"
    implementation "com.google.android.gms:play-services-safetynet:18.0.1"
    implementation "com.google.android.recaptcha:recaptcha:18.5.1"
    implementation "com.google.android.play:integrity:1.3.0"
    implementation "com.google.firebase:firebase-appcheck-playintegrity"

    // Multidex
    implementation "androidx.multidex:multidex:2.0.1"

    // Desugaring
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.4"
}

// Clean build before compilation
tasks.register("preBuildCleanup", Delete) {
    delete rootProject.file("build")
    delete rootProject.file("app/build")
}

tasks.named("preBuild") {
    dependsOn("preBuildCleanup")
}
