plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "com.google.gms.google-services"
    id "com.google.firebase.crashlytics"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    // ✅ Must exactly match package name in AndroidManifest + google-services.json
    namespace "flyhub.com"
    compileSdk 36

    defaultConfig {
        applicationId "flyhub.com"     // <-- Firebase package name
        minSdkVersion flutter.minSdkVersion               // ✅ Stable for Firebase & notifications
        targetSdkVersion 36

        versionCode 1
        versionName "1.0"

        multiDexEnabled true
    }

    compileOptions {
        // ✅ Java 11 for modern Firebase & Play Services
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
        // ✅ Desugaring for flutter_local_notifications & streams
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = "11"
    }

    signingConfigs {
        debug {
            storeFile file(System.properties['user.home'] + "/.android/debug.keystore")
            storePassword "android"
            keyAlias "AndroidDebugKey"
            keyPassword "android"
        }
        // 🔐 Add your release keystore later for Play Store builds
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
            debuggable false
        }
        debug {
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }

    packagingOptions {
        resources {
            excludes += [
                    "META-INF/DEPENDENCIES",
                    "META-INF/LICENSE",
                    "META-INF/LICENSE.txt",
                    "META-INF/NOTICE",
                    "META-INF/NOTICE.txt",
                    "META-INF/AL2.0",
                    "META-INF/LGPL2.1"
            ]
        }
    }

    // ✅ Android 14+ build compatibility
    buildFeatures {
        buildConfig = true
    }
}

flutter {
    source "../.."
}

dependencies {
    // ✅ Firebase BoM keeps all Firebase library versions in sync
    implementation platform("com.google.firebase:firebase-bom:33.6.0")

    // ✅ Core Firebase services
    implementation "com.google.firebase:firebase-auth"
    implementation "com.google.firebase:firebase-firestore"
    implementation "com.google.firebase:firebase-messaging"
    implementation "com.google.firebase:firebase-crashlytics"
    implementation "com.google.firebase:firebase-analytics"

    // ✅ Play Integrity + reCAPTCHA for secure Firebase Auth
    implementation "com.google.android.play:integrity:1.3.0"
    implementation "com.google.android.recaptcha:recaptcha:18.5.1"

    // ✅ Multidex support for larger Flutter apps
    implementation "androidx.multidex:multidex:2.0.1"

    // ✅ Core library desugaring (required for Java 11 APIs)
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.4"
}

// ✅ Optional: Clean build folders before each Gradle build
tasks.register("preBuildCleanup", Delete) {
    delete rootProject.file("build")
    delete rootProject.file("app/build")
}
tasks.named("preBuild") {
    dependsOn("preBuildCleanup")
}
