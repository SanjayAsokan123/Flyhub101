plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "com.google.gms.google-services"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.example.flyhub"
    compileSdk 36  // ✅ newer syntax, replaces compileSdkVersion

    defaultConfig {
        applicationId "com.example.flyhub"

        // ✅ Fix: Replace flutter.minSdkVersion with a safe manual fallback
        minSdkVersion flutter.minSdkVersion  // Firebase Phone Auth needs API 23+
        targetSdkVersion 36

        versionCode 1
        versionName "1.0"

        multiDexEnabled true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = "11"
    }

    signingConfigs {
        debug {
            storeFile file(System.properties['user.home'] + "/.android/debug.keystore")
            storePassword "android"
            keyAlias "AndroidDebugKey"
            keyPassword "android"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
            debuggable false
        }
        debug {
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }

    packagingOptions {
        resources {
            excludes += [
                    "META-INF/DEPENDENCIES",
                    "META-INF/LICENSE",
                    "META-INF/LICENSE.txt",
                    "META-INF/NOTICE",
                    "META-INF/NOTICE.txt",
                    "META-INF/AL2.0",
                    "META-INF/LGPL2.1"
            ]
        }
    }

    // ✅ Fix for Android 14+ Gradle changes
    buildFeatures {
        buildConfig = true
    }
}

flutter {
    source "../.."
}

dependencies {
    // ✅ Firebase BoM keeps versions consistent
    implementation platform("com.google.firebase:firebase-bom:33.6.0")

    // ✅ Firebase libraries
    implementation "com.google.firebase:firebase-auth"
    implementation "com.google.firebase:firebase-firestore"

    // ✅ Play Integrity + reCAPTCHA (needed for OTP verification)
    implementation "com.google.android.play:integrity:1.3.0"
    implementation "com.google.android.recaptcha:recaptcha:18.5.1"

    // ✅ Multidex support for larger Flutter apps
    implementation "androidx.multidex:multidex:2.0.1"
}

// ✅ Auto-clean task to prevent dex locking issues
tasks.register("preBuildCleanup", Delete) {
    delete rootProject.file("build")
    delete rootProject.file("app/build")
}

tasks.named("preBuild") {
    dependsOn("preBuildCleanup")
}
