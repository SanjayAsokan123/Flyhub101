plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "com.google.gms.google-services"
    id 'com.google.firebase.crashlytics'
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    // ✅ Must match package name in AndroidManifest + google-services.json
    namespace "flyhub.com"
    compileSdk 36

    defaultConfig {
        applicationId "flyhub.com"

        // ✅ Safe minSdk for Firebase & notifications (21 is minimum, 23 recommended)
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion 36

        versionCode 1
        versionName "1.0"

        multiDexEnabled true
    }

    compileOptions {
        // ✅ Java 11 required for new plugins & notifications
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11

        // ✅ Enable desugaring to use new Java APIs on old Android versions
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = "11"
    }

    signingConfigs {
        debug {
            storeFile file(System.properties['user.home'] + "/.android/debug.keystore")
            storePassword "android"
            keyAlias "AndroidDebugKey"
            keyPassword "android"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
            debuggable false
        }
        debug {
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }

    packagingOptions {
        resources {
            excludes += [
                    "META-INF/DEPENDENCIES",
                    "META-INF/LICENSE",
                    "META-INF/LICENSE.txt",
                    "META-INF/NOTICE",
                    "META-INF/NOTICE.txt",
                    "META-INF/AL2.0",
                    "META-INF/LGPL2.1"
            ]
        }
    }

    // ✅ Android 14+ build compatibility
    buildFeatures {
        buildConfig = true
    }
}

flutter {
    source "../.."
}

dependencies {
    // ✅ Firebase BoM (keeps versions consistent)
    implementation platform("com.google.firebase:firebase-bom:33.6.0")

    // ✅ Firebase libraries
    implementation "com.google.firebase:firebase-auth"
    implementation "com.google.firebase:firebase-firestore"

    // ✅ Play Integrity + reCAPTCHA (OTP verification support)
    implementation "com.google.android.play:integrity:1.3.0"
    implementation "com.google.android.recaptcha:recaptcha:18.5.1"

    // ✅ Multidex support
    implementation "androidx.multidex:multidex:2.0.1"

    // ✅ Core desugaring — Required for flutter_local_notifications
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.4"
}

// ✅ Optional: Auto-clean build before each run
tasks.register("preBuildCleanup", Delete) {
    delete rootProject.file("build")
    delete rootProject.file("app/build")
}

tasks.named("preBuild") {
    dependsOn("preBuildCleanup")
}
