# ============================================
# ? PERFORMANCE & MEMORY OPTIMIZATION
# ============================================
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.caching=true
org.gradle.parallel=true

# Disable Gradle configuration cache (fix for Java 21 ReferenceQueue bug)
org.gradle.configuration-cache=false
org.gradle.unsafe.configuration-cache=false
# ============================================
# ? ANDROID SETTINGS
# ============================================
android.useAndroidX=true
android.enableJetifier=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=true

# ? Updated SDK target
android.suppressUnsupportedCompileSdk=36

# ============================================
# ? KOTLIN SETTINGS
# ============================================
kotlin.code.style=official
kotlin.incremental=true

# ============================================
# ? FIREBASE SETTINGS
# ============================================
google.services.enableVersionCheck=false
firebase.performance.collection.enabled=true

# ============================================
# ? OTHER
# ============================================
android.enableBuildScriptOptimizations=true
