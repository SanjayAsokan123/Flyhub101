name: flyhub
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=2.17.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # 🌍 International Phone Field (default +91 for OTP)
  intl_phone_field: ^3.2.0

  # 📡 GraphQL (if you’re using GraphQL backend)
  graphql_flutter: ^5.2.0

  # 🔥 Firebase dependencies
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.12
  google_sign_in: ^6.2.1

  # 📱 Common Flutter packages
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.2.0
  fluttertoast: ^8.2.12
  connectivity_plus: ^6.1.4
  shared_preferences: ^2.3.3
  google_fonts: ^6.2.1
  http: ^1.2.2
  package_info_plus: ^8.1.1
  device_info_plus: ^11.2.0
  flutter_udid: ^4.0.0
  pinput: ^5.0.1
  image_picker: ^1.1.2
  share_plus: ^10.0.0
  # 🖼️ Image & Animation utilities
  flutter_image_compress: ^2.4.0
  image_cropper: ^9.1.0
  mime: ^2.0.0
  lottie: ^3.3.1
  audioplayers: ^6.0.0
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  file_picker: ^8.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true


  assets:
    - assets/
    - assets/images/
    - assets/jsonFiles/Fly.json
    - assets/jsonFiles/spalshScreenJson.json
#    - assets/sounds/success.mp3   # ✅ uncommented
