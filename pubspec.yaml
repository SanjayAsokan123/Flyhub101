name: flyhub
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=2.17.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter

  # 🌍 International Phone Field (for OTP input)
  intl_phone_field: ^3.2.0

  # 📡 GraphQL Client
  graphql_flutter: ^5.2.0

  # 🔥 Firebase Packages (Aligned with firebase_core v3)
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.12
  firebase_storage: ^12.4.2
  google_sign_in: ^6.2.1
  firebase_messaging: ^15.1.3
  firebase_analytics: ^11.3.3
  firebase_crashlytics: ^4.1.3

  # 🔔 Local notifications
  flutter_local_notifications: ^17.2.1
  timezone: ^0.9.3
  mailer: ^6.0.0
  pull_to_refresh: ^2.0.0

  # 🧰 Utility & Core Packages
  flutter_lints: ^5.0.0
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.2.0
  fluttertoast: ^8.2.12
  connectivity_plus: ^6.1.4
  shared_preferences: ^2.3.3
  google_fonts: ^6.2.1
  http: ^1.2.2
  http_parser: ^4.0.2
  mime: ^2.0.0
  path: ^1.9.0
  package_info_plus: ^8.1.1
  device_info_plus: ^11.2.0
  flutter_udid: ^4.0.0
  pinput: ^5.0.1
  share_plus: ^10.0.0
  intl: ^0.19.0

  # 🖼️ Image, Media, & Animation Utilities
  image_picker: ^1.1.2
  image_cropper: ^9.1.0
  flutter_image_compress: ^2.4.0
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  lottie: ^3.3.1
  audioplayers: ^6.0.0
  file_picker: ^8.1.2
  provider: ^6.1.2

  # 🌐 URL Launcher (for opening PDF links, maps, websites)
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/images/
    - assets/jsonFiles/Fly.json
    - assets/jsonFiles/spalshScreenJson.json
#    - assets/sounds/success.mp3
    - assets/google_logo.png
flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/MaskGroup34.png"  # 👈 Project logo
